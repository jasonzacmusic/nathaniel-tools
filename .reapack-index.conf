# Settings for cfillion's reapack-index gem, so that running it by hand agrees
# with tools/build_index.py about what this repository contains.
#
# index.xml is generated by tools/build_index.py, not by this tool - see the
# "Publishing" section of README.md. reapack-index is used in --check mode only,
# as an authoritative second opinion on the package headers.

--name "NPH REAPER Suite"
--ignore docs
--ignore reports
--ignore site
--ignore stagerig
--ignore tests
--ignore tools
