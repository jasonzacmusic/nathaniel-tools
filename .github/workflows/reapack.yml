name: reapack

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: reapack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Validate every package header with cfillion's own indexer. This job writes
  # nothing - it is the authoritative second opinion on the headers.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get install -yy pandoc

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install reapack-index
        run: gem install reapack-index

      - name: Validate packages (reapack-index)
        run: reapack-index --check

      - name: Validate packages (build_index.py)
        run: python3 tools/build_index.py --check

  # Regenerate index.xml and commit it back. tools/build_index.py is the single
  # source of truth so a local run and a CI run produce byte-identical output.
  index:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: every download URL is pinned to the commit that last
          # touched that file, which a shallow clone cannot resolve.
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get install -yy pandoc

      - name: Build index.xml
        run: python3 tools/build_index.py

      - name: Commit index.xml
        run: |
          if git diff --quiet -- index.xml; then
            echo "index.xml is already up to date"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.xml
          git commit -m 'index: rebuild for ${{ github.sha }}

          [skip ci]'
          git push
